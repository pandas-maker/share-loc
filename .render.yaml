services:
  - type: web
    name: telegrambot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 10000
      - key: WEBHOOK_URL
        generateValue: true
    disk:
      name: telegrambot-data
      mountPath: /tmp
      sizeGB: 1
